# Job Declarator Client config with Iroh network support
# JDC connects to JDS and Pool via Iroh with mDNS discovery

listening_address = "127.0.0.1:34265"

# Auth keys for encrypted connections
authority_public_key = "9auqWEzQDVyd2oe1JVGFLMLHZtCo2FFqZwtKA5gd9xbuEu7PH72"
authority_secret_key = "mkDLTBBRxdBv998612qipDYoTK3YUrqLe8uWw7gu3iXbSrn2n"
cert_validity_sec = 3600

# Iroh node configuration for upstream connections
[iroh_node_config]
secret_key_path = "/tmp/jdc-iroh-secret"
relay_mode = "default"
alpn_protocol = "jd"

# Version support
max_supported_version = 2
min_supported_version = 2

# User identity
user_identity = "iroh_test_miner"

# Mining configuration
shares_per_minute = 6.0
share_batch_size = 10
mode = "FULLTEMPLATE"

# Template Provider (using TCP for now)
tp_address = "127.0.0.1:8442"

jdc_signature = "Sv2IrohTest"
coinbase_reward_script = "addr(tb1qa0sm0hxzj0x25rh8gw5xlzwlsfvvyz8u96w3p8)"

# Upstream configuration with Iroh NodeIDs
# NOTE: The iroh_node_id fields will need to be filled in after starting
# the Pool and JDS, as they will be discovered via mDNS
[[upstreams]]
authority_pubkey = "9auqWEzQDVyd2oe1JVGFLMLHZtCo2FFqZwtKA5gd9xbuEu7PH72"
# Pool connection via Iroh (NodeID to be filled after Pool starts)
pool_address = "127.0.0.1"
pool_port = 34254
# Uncomment and fill with Pool's NodeID after it starts:
# pool_iroh_node_id = "<POOL_NODE_ID_HERE>"

# JDS connection via Iroh (NodeID to be filled after JDS starts)
jds_address = "127.0.0.1"
jds_port = 34255
# Uncomment and fill with JDS's NodeID after it starts:
# jds_iroh_node_id = "<JDS_NODE_ID_HERE>"
