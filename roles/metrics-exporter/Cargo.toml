[package]
name = "metrics-exporter"
version = "0.1.0"
edition = "2021"

[dependencies]
prometheus = { version = "0.13", features = ["process"] }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-channel = "1.5"

[dev-dependencies]
tokio-test = "0.4"
