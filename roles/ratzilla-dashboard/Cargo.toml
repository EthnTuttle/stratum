[package]
name = "ratzilla-dashboard"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ratzilla-dashboard"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.28"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
